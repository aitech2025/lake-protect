  - {key: demo-cheruvu-7, name: Demo Cheruvu 7, name_te: డెమో చెరువు 7, cohort: B_FINAL, lake: {at: [-1200, -3000], r: 260, seed: 17}, survey: [D-160], ref: DEMO/FINAL/007, area: [Demo South District, Demo Mandal 3, Demo Village 6]}
