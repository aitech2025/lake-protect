# Fictional demo world. Every place, name, survey number, record and alert here is invented.
# It sits in open sea (DECISIONS.md D-015), so nothing can coincide with a real lake, parcel or
# person. Positions are metres east and north of the origin. Days are relative to the seed date.
#
# Telugu names are drafts for review by a native speaker.

origin: [81.50, 14.50]
baseline_days_ago: 365      # monitoring started a year before the seed date
boundary_days_ago: 400

# Contact details are fictional and cannot reach anyone: .invalid addresses never resolve, and
# Indian mobile numbers never start with 0. Areas decide who is notified (DECISIONS.md D-059);
# each official also covers real districts, so the real lakes' incidents reach someone.
users:
  - {username: demo.admin,   name: Demo Admin,      role: admin, email: demo.admin@geoguard.invalid, channels: [in_app, email]}
  - username: demo.viewer1
    name: Demo Official 1
    role: viewer
    language: te
    email: demo.viewer1@geoguard.invalid
    phone: "+910000000001"
    channels: [in_app, email, sms]
    areas:
      - {district: Demo South District}
      - {district: Hyderabad}
      - {district: Ranga Reddy}
  - username: demo.viewer2
    name: Demo Official 2
    role: viewer
    email: demo.viewer2@geoguard.invalid
    phone: "+910000000002"
    channels: [in_app, email, whatsapp]
    areas:
      - {district: Demo North District}
      - {district: Medchal–Malkajgiri}
      - {district: Sangareddy}

# Notifications in the demo (D-059): the notifier's follow-up runs each morning at 09:00 IST.
notifier_hour_utc: 3.5

