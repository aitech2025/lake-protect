  - {key: demo-parcel-b,  name: Demo Parcel B,  name_te: డెమో స్థలం B,  cohort: A_RECOVERED, parcel: {at: [-400, 2900], size: [300, 200], rot: -8}, survey: [D-202], area: [Demo North District, Demo Mandal 1, Demo Village 2]}
