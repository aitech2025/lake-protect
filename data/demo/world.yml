# Records (fictional). Geometry is a box in metres relative to an asset's centre.
permits:
  - {asset: demo-cheruvu-8, ref: DEMO-BP-2025-0417, source: Demo building permission register, kind: building, box: [180, 330, -90, 60], valid_from_days: -200}
works:
  - {asset: demo-cheruvu-3, ref: DEMO-RW-0007, agency: Demo Lake Restoration Programme, description: Desilting and bund strengthening, box: [-360, 360, -360, 360], starts_days: -60, ends_days: 60}
court_cases:
  - {asset: demo-cheruvu-7, court: Demo High Court, case_no: DEMO-WP-1234/2026, status: pending, next_hearing_days: 21}

# Incident scenarios (DECISIONS.md D-057). Each runs through the real ingest, legal check and
# incident lifecycle, in time order. Steps: review (a viewer), decide (the admin: CONFIRMED or
# DISMISSED), close (the admin), pack (evidence pack), recheck (the change seen again). Shapes:
#   edge:   blob centred on the boundary edge at `angle` degrees (part inside, part buffer)
#   inside: blob at `offset` metres from the centre
#   ring:   blob in the watch ring at `angle`
#   far:    blob well outside the watch ring at `angle`
scenarios:
  - key: headline
    asset: demo-cheruvu-1
    note: Fresh land fill at the lake edge, found this week. Open, waiting for review.
    change: {type: soil_fill, stage: soil_dumped, shape: edge, angle: 35, size: [95, 60]}
    detect: {first_changed: -14, last_clear: -19, day: -2}
    steps: []

  - key: full_path
    asset: demo-cheruvu-2
    note: Reviewed, confirmed, evidence pack made, then closed once the land was restored.
    change: {type: soil_fill, stage: land_levelled, shape: edge, angle: 200, size: [110, 70]}
    detect: {first_changed: -52, last_clear: -58, day: -45}
    steps:
      - {day: -44, do: review, by: demo.viewer1, outcome: real_change, note: Fresh earth at the south-west edge on both images.}
      - {day: -43, do: decide, to: CONFIRMED, by: demo.admin, note: Real change. Fill inside the boundary of recovered land.}
      - {day: -42, do: pack, by: demo.admin}
      - {day: -10, do: close, by: demo.admin, note: The demo agency removed the fill under order DEMO/ORDER/2026/012. The lake stays on weekly watch.}

  - key: building
    asset: demo-cheruvu-4
    note: Construction inside the lake. Two officials have reviewed it; it waits for the admin's decision.
    change: {type: building, stage: building_rises, shape: inside, offset: [60, -40], size: [55, 45]}
    detect: {first_changed: -22, last_clear: -30, day: -9}
    steps:
      - {day: -8, do: review, by: demo.viewer1, outcome: real_change, note: A roofed structure where there was water.}
      - {day: -7, do: review, by: demo.viewer2, outcome: needs_site_visit, note: Looks like construction. A site visit should confirm it before any notice.}

  - key: not_real
    asset: demo-cheruvu-5
    note: Cloud shadow. Reviewed as not real, dismissed and closed.
    change: {type: soil_fill, stage: soil_dumped, shape: edge, angle: 120, size: [80, 55]}
    detect: {first_changed: -33, last_clear: -38, day: -27}
    steps:
      - {day: -26, do: review, by: demo.viewer2, outcome: not_real, note: Cloud shadow on one date only.}
      - {day: -26, do: decide, to: DISMISSED, by: demo.admin, note: Cloud shadow. The next clear image shows water.}
      - {day: -25, do: close, by: demo.admin, note: Dismissed as not a real change.}

  - key: false_alarm
    asset: demo-cheruvu-6
    note: Clearing that a site visit found to be a seasonal crop. Dismissed, not yet closed.
    change: {type: clearing, stage: land_levelled, shape: edge, angle: 300, size: [90, 60]}
    detect: {first_changed: -30, last_clear: -36, day: -24}
    steps:
      - {day: -23, do: review, by: demo.viewer1, outcome: needs_site_visit, note: Vegetation gone at the edge. It could be a crop.}
      - {day: -19, do: decide, to: DISMISSED, by: demo.admin, note: The demo agency's site visit found a seasonal crop on the lake bed. No fill or structure.}

  - key: court_hold
    asset: demo-cheruvu-7
    note: A live court case on the lake. Open, flagged for the legal team.
    change: {type: soil_fill, stage: soil_dumped, shape: edge, angle: 80, size: [85, 60]}
    detect: {first_changed: -18, last_clear: -24, day: -11}
    steps: []

  - key: watch_list
    asset: demo-kunta-5
    note: Lake with no notification. Open, flagged because its boundary is not confirmed.
    change: {type: soil_fill, stage: soil_dumped, shape: edge, angle: 150, size: [70, 50]}
    detect: {first_changed: -16, last_clear: -22, day: -8}
    steps: []

  - key: authorised_work
    asset: demo-cheruvu-3
    note: Earth-moving by the demo restoration programme. Closed at once as authorised works.
    change: {type: soil_fill, stage: land_levelled, shape: edge, angle: 250, size: [120, 70]}
    detect: {first_changed: -20, last_clear: -27, day: -13}
    steps: []

  - key: permit_conflict
    asset: demo-cheruvu-8
    note: Clearing under a building permit that overlaps the buffer. Open, flagged as a permit conflict.
    change: {type: clearing, stage: land_levelled, shape: edge, angle: 0, size: [90, 60]}
    detect: {first_changed: -12, last_clear: -17, day: -5}
    steps: []

  - key: waiting
    asset: demo-cheruvu-9
    note: Reviewed three weeks ago and still waiting for a decision. Listed on the monthly page.
    change: {type: soil_fill, stage: soil_dumped, shape: edge, angle: 60, size: [80, 60]}
    detect: {first_changed: -30, last_clear: -35, day: -22}
    steps:
      - {day: -21, do: review, by: demo.viewer2, outcome: real_change, note: Fill spreading from the bund.}

  - key: levelling
    asset: demo-parcel-c
    note: Levelling on recovered land, found this week. Open.
    change: {type: levelling, stage: land_levelled, shape: inside, offset: [20, 10], size: [70, 55]}
    detect: {first_changed: -15, last_clear: -21, day: -6}
    steps: []

  - key: reopened
    asset: demo-parcel-b
    note: Dismissed as not real, then seen again and larger. A new incident links to the old one.
    change: {type: soil_fill, stage: soil_dumped, shape: inside, offset: [-30, 20], size: [70, 50]}
    detect: {first_changed: -48, last_clear: -54, day: -41}
    steps:
      - {day: -40, do: review, by: demo.viewer1, outcome: not_real, note: Looks like a parked truck convoy.}
      - {day: -40, do: decide, to: DISMISSED, by: demo.admin, note: Vehicles, not a change of the land.}
      - {day: -39, do: close, by: demo.admin, note: Dismissed.}
      - {day: -4, do: recheck, grow: 1.6, first_changed: -12, last_clear: -40}

  - key: awaiting_boundary
    asset: demo-kunta-1
    note: Cohort C. Confirmed as a real change; the boundary is preliminary, so action waits for the final notification.
    change: {type: soil_fill, stage: soil_dumped, shape: edge, angle: 220, size: [70, 50]}
    detect: {first_changed: -34, last_clear: -40, day: -28}
    steps:
      - {day: -27, do: review, by: demo.viewer1, outcome: real_change, note: Soil dumped at the edge.}
      - {day: -26, do: decide, to: CONFIRMED, by: demo.admin, note: Real change. The boundary is preliminary, so action waits for the final notification.}

  - key: radar_only
    asset: demo-kunta-2
    note: Seen by radar only during the monsoon. Optical confirmation pending.
    change: {type: soil_fill, stage: soil_dumped, shape: edge, angle: 100, size: [65, 50]}
    detect: {first_changed: -62, last_clear: -70, day: -55, sensor_basis: radar_only, confidence: 0.55}
    steps: []

  - key: legacy
    asset: demo-parcel-a
    note: The change dates from before the asset's baseline. Closed at once, recorded only.
    change: {type: building, stage: occupied, shape: inside, offset: [40, -20], size: [60, 50]}
    detect: {first_changed: -380, last_clear: -420, day: -30}
    steps: []

  - key: out_of_scope
    asset: demo-kunta-6
    note: Change well outside the lake's watch ring. Closed at once as out of scope.
    change: {type: clearing, stage: land_levelled, shape: far, angle: 30, size: [80, 60]}
    detect: {first_changed: -25, last_clear: -31, day: -18}
    steps: []

  - key: last_month_1
    asset: demo-kunta-3
    note: Last month's incident, confirmed and waiting for action outside the app.
    change: {type: soil_fill, stage: soil_dumped, shape: edge, angle: 10, size: [60, 45]}
    detect: {first_changed: -66, last_clear: -72, day: -58}
    steps:
      - {day: -57, do: review, by: demo.viewer2, outcome: real_change, note: Soil dumped at the north edge.}
      - {day: -56, do: decide, to: CONFIRMED, by: demo.admin, note: Real change on a preliminary boundary.}

  - key: last_month_2
    asset: demo-kunta-4
    note: Last month's incident, dismissed and closed.
    change: {type: clearing, stage: land_levelled, shape: edge, angle: 280, size: [60, 45]}
    detect: {first_changed: -63, last_clear: -69, day: -50}
    steps:
      - {day: -49, do: review, by: demo.viewer1, outcome: not_real, note: Seasonal drawdown of the water edge.}
      - {day: -49, do: decide, to: DISMISSED, by: demo.admin, note: Water level, not land use.}
      - {day: -48, do: close, by: demo.admin, note: Dismissed.}

  - key: action_recorded
    asset: demo-cheruvu-5
    note: An older case, finished. Confirmed, pack made, closed after the fill was removed.
    change: {type: soil_fill, stage: soil_dumped, shape: edge, angle: 300, size: [90, 60]}
    detect: {first_changed: -78, last_clear: -84, day: -72}
    steps:
      - {day: -71, do: review, by: demo.viewer1, outcome: real_change, note: Fill at the east edge.}
      - {day: -70, do: decide, to: CONFIRMED, by: demo.admin, note: Real change inside the notified FTL.}
      - {day: -66, do: pack, by: demo.admin}
      - {day: -40, do: close, by: demo.admin, note: Fill removed under demo order DEMO/ORDER/2026/012. The land stays on weekly watch.}

# Citizen reports (DECISIONS.md D-062). Fictional reporters with demo numbers (+91 0000…, which no
# real mobile can have) and drawn demo photos. `near` puts the pin by a scenario's change; `asset`
# by a location's centre; `at` anywhere, in metres east and north of the origin.
citizen_reports:
  - key: r-full-path
    near: full_path
    day: -47
    channel: web
    language: te
    what: dumping
    description: Soil heaped on the edge of the cheruvu over two nights.
  - key: r-headline
    near: headline
    day: -4
    channel: web
    language: te
    what: dumping
    photo: true
    phone: "+910000000101"
    description: Tractors tipping soil at the edge of the cheruvu in the evenings.
  - key: r-headline-whatsapp
    near: headline
    offset: [40, 25]
    day: -3
    channel: whatsapp
    language: ur
    what: dumping
    phone: "+910000000102"
    description: Mud lorries at night near the bund.
  - key: r-not-real
    near: not_real
    day: -28
    channel: web
    language: en
    what: dumping
    description: Looks like fresh soil on the water's edge.
  - key: r-parcel-a
    asset: demo-parcel-a
    offset: [30, 10]
    day: -6
    channel: helpline_1070
    by: demo.viewer1
    source_ref: 1070/DEMO/0412
    language: te
    what: fencing
    description: Caller says stone posts and wire went up along the road side of the parcel.
    steps:
      - {day: -5, do: check, by: demo.viewer1, outcome: not_visible, note: Posts and wire are too small for the 10 m images. Nothing visible yet.}
  - key: r-kunta
    asset: demo-kunta-4
    day: -9
    channel: web
    language: en
    what: clearing
    photo: true
    description: Bushes cut on the tank bed.
    steps:
      - {day: -8, do: check, by: demo.viewer1, outcome: not_visible, note: No change on this week's image.}
      - {day: -6, do: close, by: demo.admin, reason: no_change_seen, note: Weeds cleared by the tank users' group. No fill and no structure.}
  - key: r-outside
    at: [5200, 4300]
    day: -12
    channel: praja_vani
    by: demo.viewer2
    source_ref: PV/DEMO/2026/031
    language: en
    what: construction
    description: Petition about a shed going up on a field next to the village road.
    steps:
      - {day: -10, do: close, by: demo.admin, reason: passed_on, department: revenue, note: Patta land outside every watched location. Sent to the Tahsildar.}
