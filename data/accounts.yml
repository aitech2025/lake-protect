# Role accounts (DECISIONS.md D-065). GeoGuard holds no real people's accounts yet: these are the
# sign-in accounts the owner kept when the demo world was removed. They work on real data only.
# Contact details are placeholders (.invalid addresses, 0000 numbers): nothing is ever delivered.
# Areas are real districts; officials are notified of incidents in them.
users:
  - {username: demo.admin, name: Demo Admin, role: admin, email: demo.admin@geoguard.invalid, channels: [in_app, email]}
  - username: demo.viewer1
    name: Demo Official 1
    role: viewer
    language: te
    email: demo.viewer1@geoguard.invalid
    phone: "+910000000001"
    channels: [in_app, email, sms]
    areas:
      - {district: Hyderabad}
      - {district: Ranga Reddy}
  - username: demo.viewer2
    name: Demo Official 2
    role: viewer
    email: demo.viewer2@geoguard.invalid
    phone: "+910000000002"
    channels: [in_app, email, whatsapp]
    areas:
      - {district: Medchal–Malkajgiri}
      - {district: Sangareddy}
