# Lake Protect prototype. `docker compose up` on one machine (CONTEXT.md section 11).
# Secrets come from .env (see .env.example). Named volumes keep database files, evidence
# packs and node_modules out of the OneDrive folder.
name: lakeprotect

x-api-env: &api-env
  LP_DATABASE_URL: postgresql+psycopg://${LP_DB_USER:?set in .env}:${LP_DB_PASSWORD:?set in .env}@db:5432/${LP_DB_NAME:?set in .env}
  LP_TEST_DATABASE_URL: postgresql+psycopg://${LP_DB_USER}:${LP_DB_PASSWORD}@db:5432/${LP_DB_NAME}_test
  LP_JWT_SECRET: ${LP_JWT_SECRET:?set in .env}
  LP_PIPELINE_TOKEN: ${LP_PIPELINE_TOKEN:-}
  LP_STORAGE_DIR: /var/lp/storage
  LP_STORAGE_BACKEND: ${LP_STORAGE_BACKEND:-local}
  LP_S3_BUCKET: ${LP_S3_BUCKET:-}
  LP_S3_ENDPOINT_URL: ${LP_S3_ENDPOINT_URL:-}
  LP_S3_REGION: ${LP_S3_REGION:-ap-south-1}
  LP_S3_ACCESS_KEY_ID: ${LP_S3_ACCESS_KEY_ID:-}
  LP_S3_SECRET_ACCESS_KEY: ${LP_S3_SECRET_ACCESS_KEY:-}
  LP_S3_KMS_KEY_ID: ${LP_S3_KMS_KEY_ID:-}
  LP_OUTBOX_WEBHOOK_URL: ${LP_OUTBOX_WEBHOOK_URL:-}
  LP_OUTBOX_WEBHOOK_TOKEN: ${LP_OUTBOX_WEBHOOK_TOKEN:-}
  LP_OUTBOX_BATCH_SIZE: ${LP_OUTBOX_BATCH_SIZE:-25}
  LP_OUTBOX_MAX_ATTEMPTS: ${LP_OUTBOX_MAX_ATTEMPTS:-12}
  LP_OUTBOX_CLAIM_TIMEOUT_SECONDS: ${LP_OUTBOX_CLAIM_TIMEOUT_SECONDS:-300}
  LP_DB_POOL_SIZE: ${LP_DB_POOL_SIZE:-10}
  LP_DB_MAX_OVERFLOW: ${LP_DB_MAX_OVERFLOW:-20}
  LP_DB_POOL_TIMEOUT_SECONDS: ${LP_DB_POOL_TIMEOUT_SECONDS:-30}
  LP_DB_POOL_RECYCLE_SECONDS: ${LP_DB_POOL_RECYCLE_SECONDS:-1800}
  LP_DB_STATEMENT_TIMEOUT_MS: ${LP_DB_STATEMENT_TIMEOUT_MS:-60000}
  LP_DATA_DIR: /srv/data
  LP_REPO_DIR: /srv/repo

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${LP_DB_USER}
      POSTGRES_PASSWORD: ${LP_DB_PASSWORD}
      POSTGRES_DB: ${LP_DB_NAME}
    ports:
      - "127.0.0.1:${LP_DB_PORT:-5544}:5432"
    volumes:
      - lp_pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-run init the temporary server answers on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: lakeprotect-api:dev
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/api/app"
    environment: *api-env
    ports:
      - "127.0.0.1:${LP_API_PORT:-8100}:8000"
    volumes:
      - ./api:/srv/api
      - ./pipeline:/srv/pipeline
      - ./data:/srv/data:ro
      - ./:/srv/repo:ro
      - lp_storage:/var/lp/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One scheduled worker: records missed timers and escalates them (section 6.6).
  worker:
    image: lakeprotect-api:dev
    command: python -m app.worker
    environment:
      <<: *api-env
      LP_WORKER_INTERVAL_SECONDS: "300"
    volumes:
      - ./api:/srv/api
      - ./pipeline:/srv/pipeline
      - ./data:/srv/data:ro
      - lp_storage:/var/lp/storage
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
    image: lakeprotect-web:dev
    ports:
      - "127.0.0.1:${LP_WEB_PORT:-8180}:80"
    depends_on:
      api:
        condition: service_healthy

  # Browser tests: docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    build:
      context: ./e2e
    image: lakeprotect-e2e:dev
    # Share the web container's network, so the app is http://localhost: a secure context, as on
    # a real phone over HTTPS. Service workers and geolocation need one.
    network_mode: "service:web"
    environment:
      E2E_BASE: http://localhost
    volumes:
      - ./e2e/tests:/e2e/tests:ro
      - ./e2e/playwright.config.ts:/e2e/playwright.config.ts:ro
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      web:
        condition: service_started

volumes:
  lp_pgdata:
  lp_storage:
