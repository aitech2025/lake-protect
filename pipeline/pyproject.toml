[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-protect"
version = "0.1.0"
description = "Lake Protect detection pipeline and pack verifier"
requires-python = ">=3.11"
# Base install stays light: `lp verify-pack` needs only these and is also used inside the API image.
dependencies = ["typer>=0.12,<1"]

[project.optional-dependencies]
geo = [
    "pystac-client>=0.8,<1",
    "odc-stac>=0.3.10,<1",
    "rioxarray>=0.17,<1",
    "rasterio>=1.4,<2",
    "scikit-image>=0.24,<1",
    "geopandas>=1.0,<2",
    "shapely>=2.0.6,<3",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pyproj>=3.7,<4",
    "httpx>=0.27,<1",
]
osm = ["httpx>=0.27,<1", "shapely>=2.0.6,<3", "pyproj>=3.7,<4", "pyyaml>=6,<7"]
dev = ["pytest>=8.3,<9"]

[project.scripts]
lp = "lake_protect.cli:app"

[tool.setuptools.packages.find]
include = ["lake_protect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -ra"
