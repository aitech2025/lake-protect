# GeoGuard prototype (formerly Lake Protect; the project and image names keep the old name, D-061). `docker compose up` on one machine (CONTEXT.md section 11).
# Secrets come from .env (see .env.example). Named volumes keep database files, evidence
# packs and node_modules out of the OneDrive folder.
name: lakeprotect

x-api-env: &api-env
  LP_DATABASE_URL: postgresql+psycopg://${LP_DB_USER:?set in .env}:${LP_DB_PASSWORD:?set in .env}@db:5432/${LP_DB_NAME:?set in .env}
  LP_TEST_DATABASE_URL: postgresql+psycopg://${LP_DB_USER}:${LP_DB_PASSWORD}@db:5432/${LP_DB_NAME}_test
  LP_JWT_SECRET: ${LP_JWT_SECRET:?set in .env}
  LP_PIPELINE_TOKEN: ${LP_PIPELINE_TOKEN:-}
  LP_STORAGE_DIR: /var/lp/storage
  LP_DATA_DIR: /srv/data
  LP_REPO_DIR: /srv/repo
  # Notifications (DECISIONS.md D-059). Email goes to the local outbox folder unless set to smtp.
  LP_PUBLIC_URL: ${LP_PUBLIC_URL:-http://localhost:8180}
  LP_EMAIL_TRANSPORT: ${LP_EMAIL_TRANSPORT:-file}
  LP_SMTP_HOST: ${LP_SMTP_HOST:-}
  LP_SMTP_PORT: ${LP_SMTP_PORT:-587}
  LP_SMTP_USER: ${LP_SMTP_USER:-}
  LP_SMTP_PASSWORD: ${LP_SMTP_PASSWORD:-}
  LP_SMS_TOKEN: ${LP_SMS_TOKEN:-}
  LP_WHATSAPP_TOKEN: ${LP_WHATSAPP_TOKEN:-}
  LP_WHATSAPP_APP_SECRET: ${LP_WHATSAPP_APP_SECRET:-}
  LP_WHATSAPP_VERIFY_TOKEN: ${LP_WHATSAPP_VERIFY_TOKEN:-}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${LP_DB_USER}
      POSTGRES_PASSWORD: ${LP_DB_PASSWORD}
      POSTGRES_DB: ${LP_DB_NAME}
    ports:
      - "127.0.0.1:${LP_DB_PORT:-5544}:5432"
    volumes:
      - lp_pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-run init the temporary server answers on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: lakeprotect-api:dev
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/api/app"
    environment: *api-env
    ports:
      - "127.0.0.1:${LP_API_PORT:-8100}:8000"
    volumes:
      - ./api:/srv/api
      - ./pipeline:/srv/pipeline
      - ./data:/srv/data:ro
      - ./:/srv/repo:ro
      - lp_storage:/var/lp/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The notifier (DECISIONS.md D-059): reminders after 24 hours, the admin told after 48, and the
  # outbox of emails and messages, every minute. It replaces the escalation worker removed with
  # the timers on 24 Nov 2026 (D-057).
  notifier:
    image: lakeprotect-api:dev
    command: python -m app.notify run --every 60
    environment: *api-env
    volumes:
      - ./api:/srv/api
      - ./data:/srv/data:ro
      - lp_storage:/var/lp/storage
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
    image: lakeprotect-web:dev
    ports:
      - "127.0.0.1:${LP_WEB_PORT:-8180}:80"
    depends_on:
      api:
        condition: service_healthy

  # The weekly screen from space (needs internet, so it has its own profile and is never part of
  # the offline demo): docker compose --profile screen up -d screener
  screener:
    profiles: ["screen"]
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    image: lakeprotect-screener:dev
    environment:
      LP_API_URL: http://api:8000
      LP_PIPELINE_TOKEN: ${LP_PIPELINE_TOKEN:?set in .env}
      LP_CACHE_DIR: /var/lp/cache
    volumes:
      - lp_cache:/var/lp/cache
      - ./reports:/srv/repo/reports
    depends_on:
      api:
        condition: service_healthy

  # Satellite review of citizens' reports (D-063): the newest Sentinel-2 looks at each reported
  # place, within minutes of the report. Needs internet, like the screener:
  # docker compose --profile screen up -d reviewer
  reviewer:
    profiles: ["screen"]
    image: lakeprotect-screener:dev
    command: lp review-reports --every 300
    environment:
      LP_API_URL: http://api:8000
      LP_PIPELINE_TOKEN: ${LP_PIPELINE_TOKEN:?set in .env}
      LP_CACHE_DIR: /var/lp/cache
    volumes:
      - lp_cache:/var/lp/cache
    depends_on:
      api:
        condition: service_healthy

  # Browser tests: docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    build:
      context: ./e2e
    image: lakeprotect-e2e:dev
    # Share the web container's network, so the app is http://localhost: a secure context, as on
    # a real phone over HTTPS. Service workers and geolocation need one.
    network_mode: "service:web"
    environment:
      E2E_BASE: http://localhost
    volumes:
      - ./e2e/tests:/e2e/tests:ro
      - ./e2e/playwright.config.ts:/e2e/playwright.config.ts:ro
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      web:
        condition: service_started

volumes:
  lp_pgdata:
  lp_storage:
  lp_cache:
