name: Lake Protect CI

on:
  push:
    branches: ["feature/initial", "feat/**"]
  pull_request:
    branches: ["feature/initial"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lakeprotect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lakeprotect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LP_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lakeprotect
      LP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lakeprotect_test
      LP_JWT_SECRET: ci-only-secret-change-before-deployment
      LP_PIPELINE_TOKEN: ci-only-pipeline-token
      LP_DB_POOL_SIZE: 3
      LP_DB_MAX_OVERFLOW: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install native PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install API and shared pipeline package
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -e pipeline
      - name: Run API and PostGIS integration tests
        working-directory: api
        run: pytest -q

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pipeline test dependencies
        working-directory: pipeline
        run: pip install -e ".[dev]"
      - name: Run pipeline tests
        working-directory: pipeline
        run: pytest -q
