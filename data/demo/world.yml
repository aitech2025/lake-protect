  - {key: demo-kunta-2, name: Demo Kunta 2, name_te: డెమో కుంట 2, cohort: C_PRELIM, lake: {at: [-2000, 3600], r: 120, seed: 22}, survey: [D-302], ref: DEMO/PRELIM/002, area: [Demo North District, Demo Mandal 1, Demo Village 2]}
  - {key: demo-kunta-3, name: Demo Kunta 3, name_te: డెమో కుంట 3, cohort: C_PRELIM, lake: {at: [1800, 3600], r: 110, seed: 23}, survey: [D-303], ref: DEMO/PRELIM/003, area: [Demo North District, Demo Mandal 2, Demo Village 4]}
  - {key: demo-kunta-4, name: Demo Kunta 4, name_te: డెమో కుంట 4, cohort: C_PRELIM, lake: {at: [-300, -800], r: 125, seed: 24}, survey: [D-304], ref: DEMO/PRELIM/004, area: [Demo South District, Demo Mandal 3, Demo Village 5]}
  # Cohort D: lakes without a notification (derived outline, watch only)
  - {key: demo-kunta-5, name: Demo Kunta 5, name_te: డెమో కుంట 5, cohort: D_UNNOTIFIED, lake: {at: [4200, -1800], r: 120, seed: 25}, survey: [], area: [Demo South District, Demo Mandal 4, Demo Village 8]}
  - {key: demo-kunta-6, name: Demo Kunta 6, name_te: డెమో కుంట 6, cohort: D_UNNOTIFIED, lake: {at: [-4300, 600], r: 115, seed: 26}, survey: [], area: [Demo North District, Demo Mandal 1, Demo Village 1]}
  - {key: demo-kunta-7, name: Demo Kunta 7, name_te: డెమో కుంట 7, cohort: D_UNNOTIFIED, lake: {at: [900, -3700], r: 110, seed: 27}, survey: [], area: [Demo South District, Demo Mandal 4, Demo Village 8]}
  - {key: demo-kunta-8, name: Demo Kunta 8, name_te: డెమో కుంట 8, cohort: D_UNNOTIFIED, lake: {at: [-2900, 1500], r: 105, seed: 28}, survey: [], area: [Demo North District, Demo Mandal 1, Demo Village 1]}

