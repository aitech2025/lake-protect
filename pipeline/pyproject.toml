[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-protect"
version = "0.1.0"
description = "GeoGuard detection pipeline and pack verifier"
requires-python = ">=3.11"
# Base install stays light: `lp verify-pack` needs only these and is also used inside the API image.
dependencies = ["typer>=0.12,<1"]

[project.optional-dependencies]
# DECISIONS.md D-041: rasterio, numpy and scipy do the work odc-stac, rioxarray, scikit-image and
# geopandas were listed for, with a smaller install that also fits a slim container.
geo = [
    "pystac-client>=0.8,<1",
    "rasterio>=1.4,<2",
    "scipy>=1.14,<2",
    "shapely>=2.0.6,<3",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pyproj>=3.7,<4",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "boto3>=1.35,<2",
]
osm = ["httpx>=0.27,<1", "shapely>=2.0.6,<3", "pyproj>=3.7,<4", "pyyaml>=6,<7"]
dev = ["pytest>=8.3,<9"]

ml = ["scikit-learn>=1.5,<2", "joblib>=1.4,<2", "numpy>=2,<3"]
integrations = ["httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.scripts]
lp = "lake_protect.cli:app"
lp-train-model = "lake_protect.intelligence.train_cli:main"
lp-geo = "lake_protect.geospatial.cli:app"

[tool.setuptools.packages.find]
include = ["lake_protect*"]

[tool.setuptools.package-data]
lake_protect = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -ra"
